<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện Phim Interactive</title>
    <link rel="stylesheet" href="css/main_menu.css">
</head>
<body>

    <div class="menu-container">
        <h1 class="main-title">THƯ VIỆN GAME OTOME CỦA EM TRUN</h1>
        <p class="sub-title">Chọn một tập để bắt đầu sự xàm xí</p>

        <div class="films-grid">
            <!-- Thẻ phim 1 -->
            <a href="film_1/index.html" class="film-card">
                <div class="card-cover" style="background-image: url('film_1/assets/imgs/scene1.png');">
                    <span class="badge">TẬP 1</span>
                </div>
                <div class="card-info">
                    <h3>Ngày </h3>
                    <p>Một đêm mưa bão, cuộc gặp gỡ bất ngờ tại nhà thuốc nhỏ...</p>
                </div>
            </a>

            <!-- Thẻ phim 2 (Sẵn sàng cho tương lai) -->
            <div class="film-card locked">
                <div class="card-cover">
                    <span class="badge">TẬP 2</span>
                    <div class="lock-overlay">🔒 Sắp ra mắt</div>
                </div>
                <div class="card-info">
                    <h3>Tập Phim 2</h3>
                    <p>Nội dung câu chuyện tiếp theo đang được cập nhật...</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
