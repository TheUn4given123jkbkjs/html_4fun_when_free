<!DOCTYPE html>

<html lang="vi">
    <header>
        <meta charset="UTF-8">
        <title>Login</title>
        <style>
            body{
                display: flex;
                justify-content: center;
                align-items: center;
                margin-top: 6rem;
            }
            td{
                width: fit-content;
                text-align: left;
                white-space: nowrap;
                padding: 0.2rem
            }
            table {
                border-collapse: collapse;
                border: none;
                padding: 0.2rem
            }
        </style>
    </header>
    <body>
        <form action="login.php" method="post">
            <table style="table-layout: auto;">
                <tr>
                    <td><label for="email">Email / Username</label></td>
                    <td><input type="email" id="email" name="email" required placeholder="email@domain.com"></td>
                </tr>
                <tr>
                    <td>Password</td>
                    <td><input type="password" id="password" name="password" required placeholder="password"</td>
                </tr>  
                <tr>
                    <td><label for="remember">Remember me</label></td>
                    <td  style="text-align: left;"><input type="checkbox" id="remember"name="rememberme"></td>
                </tr>
                <tr>
                    <td></td>
                    <td><button type="submit"">Login</button></td>
                </tr>
                <tr>
                    <td>Not registered? <a href="register.html" target="_self">Create a account here.</a></td>
                </tr>
                <tr>
                    <td>Forgot your password? <a href="reset_password.htlm">Click here to reset.</a></td>
                </tr>
            </table>
        </form>
    </body>
</html>
