<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header class="fixed-top header">

        <div class="train">
            <span>My Trailblaze page</span>
            <button
                type="button"
                class="btn p-0 border-0 bg-transparent"
                id="trainButton"
            >
                <img
                    src="assets/dau-tau.png"
                    alt="Train navigation"
                    class="img-fluid"
                >
            </button>

            <!-- Các toa [1] [2] [3] -->
            <div class="carriages">

                <button type="button" class="btn p-0 border-0 bg-transparent">
                    <img src="assets/toa-tau.png" alt="About Me">
                    <span class="carriage-label">
                        ABOUT ME
                    </span>
                </button>

                <button type="button" class="btn p-0 border-0 bg-transparent">
                    <img src="assets/toa-tau.png" alt="Projects">
                    <span  class="carriage-label">
                        PROJECT
                    </span>
                </button>

                <button type="button" class="btn p-0 border-0 bg-transparent">
                    <img src="assets/toa-tau.png" alt="Interests">
                        <span class="carriage-label">
                            INTEREST
                        </span>
                </button>

            </div>

        </div>

    </header>

    <main class="container">
    </main>

    <footer>
    </footer>

</body>
</html>
